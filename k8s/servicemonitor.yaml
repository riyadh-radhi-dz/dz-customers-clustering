apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: dz-clustering-monitor
  labels:
    app: dz-clustering
    release: prometheus
spec:
  selector:
    matchLabels:
      app: dz-clustering
      component: api
  endpoints:
  - port: http
    path: /metrics
    interval: 30s
    scrapeTimeout: 10s

