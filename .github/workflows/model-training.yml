name: Model Training Pipeline

on:
  schedule:
    # Run daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force_retrain:
        description: 'Force model retraining'
        required: false
        default: 'false'
      improvement_threshold:
        description: 'Improvement threshold (e.g., 0.02 for 2%)'
        required: false
        default: '0.02'

jobs:
  train-model:
    name: Train ML Model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv sync
      
      - name: Set up ClickHouse credentials
        env:
          CLICKHOUSE_HOST: ${{ secrets.CLICKHOUSE_HOST }}
          CLICKHOUSE_PORT: ${{ secrets.CLICKHOUSE_PORT }}
          CLICKHOUSE_USERNAME: ${{ secrets.CLICKHOUSE_USERNAME }}
          CLICKHOUSE_PASSWORD: ${{ secrets.CLICKHOUSE_PASSWORD }}
          CLICKHOUSE_DATABASE: ${{ secrets.CLICKHOUSE_DATABASE }}
        run: |
          cat > .env << EOF
          CLICKHOUSE_HOST=$CLICKHOUSE_HOST
          CLICKHOUSE_PORT=$CLICKHOUSE_PORT
          CLICKHOUSE_USERNAME=$CLICKHOUSE_USERNAME
          CLICKHOUSE_PASSWORD=$CLICKHOUSE_PASSWORD
          CLICKHOUSE_DATABASE=$CLICKHOUSE_DATABASE
          CLICKHOUSE_SECURE=true
          EOF
      
      - name: Run validation and promotion pipeline
        env:
          MODEL_IMPROVEMENT_THRESHOLD: ${{ github.event.inputs.improvement_threshold || '0.02' }}
        run: |
          source .venv/bin/activate
          python3 scripts/validate_and_promote_model.py
      
      - name: Validate artifacts
        run: |
          source .venv/bin/activate
          # Check both champion and current production artifacts
          python -c "from dz_customers_clustering.inference import load_preprocess_artifacts; load_preprocess_artifacts()"
          ls -la artifacts/champion/ || echo "No champion yet"
          ls -la artifacts/challenger/ || echo "No challenger"
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: model-artifacts-${{ github.run_number }}
          path: |
            artifacts/
            outputs/
          retention-days: 90
      
      - name: Upload to MLflow (optional)
        if: success()
        run: |
          source .venv/bin/activate
          # Add MLflow tracking code here
          echo "Upload artifacts to MLflow model registry"
      
      - name: Create release on success
        if: success() && github.event.inputs.force_retrain != 'true'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: model-v${{ github.run_number }}
          release_name: Model Release v${{ github.run_number }}
          body: |
            Automated model training run completed successfully.
            
            Run number: ${{ github.run_number }}
            Commit: ${{ github.sha }}
            
            Artifacts have been uploaded and are ready for deployment.
          draft: false
          prerelease: false

  validate-model:
    name: Validate Model Performance
    needs: train-model
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: model-artifacts-${{ github.run_number }}
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      
      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
      
      - name: Install dependencies
        run: |
          uv venv
          source .venv/bin/activate
          uv sync
      
      - name: Run model validation tests
        run: |
          source .venv/bin/activate
          python src/dz_customers_clustering/predict.py
      
      - name: Generate model report
        run: |
          source .venv/bin/activate
          python src/dz_customers_clustering/summary.py

