[project]
name = "dz-customers-clustering"
version = "1.0.0"
description = "Production-ready ML API for customer clustering using K-Prototypes algorithm"
readme = "README.md"
requires-python = ">=3.13"
authors = [
    { name = "DigitalZone Team", email = "ml-ops@digitalzone.com" }
]
license = { text = "MIT" }
keywords = ["machine-learning", "clustering", "k-prototypes", "mlops", "fastapi"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.13",
]

dependencies = [
    "fastapi[standard]>=0.121.1",
    "clickhouse-connect>=0.6.0",
    "kmodes>=0.12.0",
    "matplotlib>=3.7.0",
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "python-dotenv>=1.2.0",
    "pydantic>=2.12.0",
    "pydantic-settings>=2.0.0",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "scipy>=1.11.0",
    "prometheus-client>=0.19.0",
    "joblib>=1.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
    "ruff>=0.2.0",
    "black>=24.0.0",
    "isort>=5.13.0",
    "mypy>=1.8.0",
    "pylint>=3.0.0",
    "bandit>=1.7.0",
    "safety>=2.3.0",
    "pre-commit>=3.5.0",
]

mlflow = [
    "mlflow>=2.9.0",
]

[project.urls]
Homepage = "https://github.com/digitalzone/dz-customers-clustering"
Documentation = "https://github.com/digitalzone/dz-customers-clustering/tree/main/docs"
Repository = "https://github.com/digitalzone/dz-customers-clustering"
Issues = "https://github.com/digitalzone/dz-customers-clustering/issues"

[tool.black]
line-length = 100
target-version = ['py313']
include = '\.pyi?$'
extend-exclude = '''
/(
  \.eggs
  | \.git
  | \.venv
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --cov=app --cov=src --cov-report=html --cov-report=term-missing"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests/", "venv/", ".venv/"]
skips = ["B101"]

[tool.coverage.run]
source = ["app", "src"]
omit = ["tests/*", "**/__pycache__/*", "**/.venv/*"]

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
