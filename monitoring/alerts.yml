groups:
  - name: dz_clustering_alerts
    interval: 30s
    rules:
      # API Health Alerts
      - alert: APIDown
        expr: up{job="dz-clustering-api"} == 0
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "API is down"
          description: "The DZ Clustering API has been down for more than 5 minutes."

      # Performance Alerts
      - alert: HighRequestLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High request latency detected"
          description: "95th percentile latency is above 1 second."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status_code=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: critical
          component: api
        annotations:
          summary: "High error rate detected"
          description: "Error rate is above 5%."

      # Resource Alerts
      - alert: HighMemoryUsage
        expr: container_memory_usage_bytes{container="api"} / container_spec_memory_limit_bytes{container="api"} > 0.9
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High memory usage"
          description: "Memory usage is above 90%."

      - alert: HighCPUUsage
        expr: rate(container_cpu_usage_seconds_total{container="api"}[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
          component: api
        annotations:
          summary: "High CPU usage"
          description: "CPU usage is above 80%."

      # Model Performance Alerts
      - alert: ModelLoadFailed
        expr: ml_model_info == 0
        for: 1m
        labels:
          severity: critical
          component: ml-model
        annotations:
          summary: "Model failed to load"
          description: "ML model is not loaded properly."

      - alert: DataDriftDetected
        expr: ml_data_drift_score > 0.1
        for: 30m
        labels:
          severity: warning
          component: ml-model
        annotations:
          summary: "Data drift detected"
          description: "Significant data drift detected in features."

      - alert: SlowPredictions
        expr: histogram_quantile(0.95, rate(ml_prediction_duration_seconds_bucket[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
          component: ml-model
        annotations:
          summary: "Slow prediction times"
          description: "95th percentile prediction time is above 500ms."

      # Rate Limiting Alerts
      - alert: HighRateLimitHits
        expr: rate(http_requests_total{status_code="429"}[5m]) > 10
        for: 5m
        labels:
          severity: info
          component: api
        annotations:
          summary: "High rate limit hits"
          description: "Many requests are being rate limited."

